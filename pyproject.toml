[project]
name = "gisp"
version = "0.1.0"
description = "A minimal Lisp interpreter"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lark>=1.2",
    "numpy>=2.5.3",
    "sympy>=1.14.0",
]

[project.scripts]
gisp = "gisp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/Analysis", "src/Evaluate", "src/Expander", "src/Reader", "src/Resolve", "src/Syntax", "src/TypeCheck", "exe/gisp"]

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.136"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 88
extend-exclude = ["nix"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP035"]

[tool.ty.environment]
python-version = "3.14"
python = ".venv"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
output-format = "concise"

[tool.pydoctor]
project-name = "gisp"
html-output = "docs"
docformat = "google"
intersphinx = []
quiet = false
